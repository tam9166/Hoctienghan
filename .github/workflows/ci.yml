name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: find api data scripts tests -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Production build contract
        run: node scripts/verify-production-build.js
      - name: Launch readiness contract
        run: node scripts/release-readiness.js
      - name: Unit and static regression tests
        run: |
          count=0
          for file in tests/*.test.js; do
            node "$file"
            count=$((count + 1))
          done
          echo "Passed $count test files"
