<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f8f9fa" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0f1419" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="TH-Tiếng Hàn" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css?v=7" />
  <script>
    (() => {
      try {
        const settings = JSON.parse(localStorage.getItem('klearn_settings') || '{}');
        const session = JSON.parse(localStorage.getItem('klearn_session') || 'null');
        const userPreference = session?.userId && settings?.users?.[session.userId]?.theme;
        const preference = ['system', 'light', 'dark'].includes(userPreference) ? userPreference : (['system', 'light', 'dark'].includes(settings.theme) ? settings.theme : 'system');
        const dark = preference === 'dark' || (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (_) {
        document.documentElement.dataset.themePreference = 'system';
        document.documentElement.dataset.theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
    })();
  </script>
  <title>TH-Tiếng Hàn</title>
</head>
<body>
  <div id="app-shell">
    <header class="topbar hidden" id="topbar">
      <button class="avatar-btn" id="avatarBtn" aria-label="Mở trang cá nhân">
        <span class="avatar">한</span>
      </button>
      <div class="brand">TH-Tiếng Hàn</div>
      <div class="streak"><span id="streakCount">0</span> 🔥</div>
    </header>

    <main id="app" class="app-content" aria-live="polite"></main>

    <nav class="bottom-nav hidden" id="bottomNav" aria-label="Điều hướng chính">
      <button data-route="home" class="nav-item active"><span class="nav-icon">🏠</span><span>Trang chủ</span></button>
      <button data-route="lessons" class="nav-item"><span class="nav-icon">📖</span><span>Học</span></button>
      <button data-route="review" class="nav-item"><span class="nav-icon">🧠</span><span>Ôn tập</span></button>
      <button data-route="practice" class="nav-item"><span class="nav-icon">🎙</span><span>Luyện tập</span></button>
      <button data-route="profile" class="nav-item"><span class="nav-icon">👤</span><span>Cá nhân</span></button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <script src="data/romanization.js?v=7"></script>
  <script src="data/vocabulary-bank.js?v=7"></script>
  <script src="data/learning-modules.js?v=7"></script>
  <script src="data/practice-bank.js?v=7"></script>
  <script src="app.js?v=7"></script>
</body>
</html>
