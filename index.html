<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f8f9fa" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0f1419" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="TamHoanq" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css?v=16" />
  <script>
    (() => {
      try {
        const settings = JSON.parse(localStorage.getItem('klearn_settings') || '{}');
        const session = JSON.parse(localStorage.getItem('klearn_session') || 'null');
        const userPreference = session?.userId && settings?.users?.[session.userId]?.theme;
        const preference = ['system', 'light', 'dark'].includes(userPreference) ? userPreference : (['system', 'light', 'dark'].includes(settings.theme) ? settings.theme : 'system');
        const userLanguage = session?.userId && settings?.users?.[session.userId]?.language;
        const language = ['vi', 'en', 'zh-CN'].includes(userLanguage) ? userLanguage : (['vi', 'en', 'zh-CN'].includes(settings.language) ? settings.language : 'vi');
        document.documentElement.lang = language;
        const dark = preference === 'dark' || (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (_) {
        document.documentElement.dataset.themePreference = 'system';
        document.documentElement.dataset.theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
    })();
  </script>
  <title>Tiếng Hàn - TamHoanq</title>
</head>
<body>
  <div id="app-shell">
    <header class="topbar hidden" id="topbar">
      <button class="avatar-btn" id="avatarBtn" aria-label="Mở trang cá nhân">
        <span class="avatar" aria-label="Logo TH">TH</span>
      </button>
      <div class="brand" data-view="dictionary" role="button" tabindex="0">Tiếng Hàn - TamHoanq</div>
      <div class="header-actions">
        <button class="header-control" id="globalSearchButton" type="button" aria-label="Tìm kiếm toàn app">⌕</button>
        <div class="header-control-wrap">
          <button class="header-control" id="languageBtn" type="button" aria-label="Đổi ngôn ngữ" aria-haspopup="menu" aria-expanded="false"><span aria-hidden="true">🌐</span><span id="languageCode">VI</span></button>
          <div class="header-menu hidden" id="languageMenu" role="menu"><strong class="header-menu-title">Ngôn ngữ</strong><button type="button" data-language-choice="vi" role="menuitemradio">🇻🇳 <span>Tiếng Việt</span></button><button type="button" data-language-choice="en" role="menuitemradio">🇬🇧 <span>English</span></button><button type="button" data-language-choice="zh-CN" role="menuitemradio">🇨🇳 <span>中文（简体）</span></button></div>
        </div>
        <div class="header-control-wrap">
          <button class="header-control" id="themeBtn" type="button" aria-label="Đổi giao diện" aria-haspopup="menu" aria-expanded="false"><span id="themeIcon" aria-hidden="true">◐</span></button>
          <div class="header-menu hidden" id="themeMenu" role="menu"><strong class="header-menu-title">Giao diện</strong><button type="button" data-theme-choice-header="system" role="menuitemradio">◐ <span>Theo thiết bị</span></button><button type="button" data-theme-choice-header="light" role="menuitemradio">☀️ <span>Sáng</span></button><button type="button" data-theme-choice-header="dark" role="menuitemradio">🌙 <span>Tối</span></button></div>
        </div>
        <div class="streak"><span id="streakCount">0</span> 🔥</div>
      </div>
    </header>

    <main id="app" class="app-content" aria-live="polite"></main>

    <nav class="bottom-nav hidden" id="bottomNav" aria-label="Điều hướng chính">
      <button data-route="home" class="nav-item active"><span class="nav-icon">🏠</span><span>Trang chủ</span></button>
      <button data-route="theory" class="nav-item"><span class="nav-icon">📚</span><span>Lý thuyết</span></button>
      <button data-route="roadmap" class="nav-item"><span class="nav-icon">🗺</span><span>Lộ trình</span></button>
      <button data-route="topik" class="nav-item"><span class="nav-icon">🏆</span><span>Luyện TOPIK</span></button>
      <button data-route="ai-coach" class="nav-item"><span class="nav-icon">✨</span><span>AI Coach</span></button>
      <button data-route="profile" class="nav-item"><span class="nav-icon">👤</span><span>Cá nhân</span></button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <div id="aiRoot"></div>
  <script src="locales/vi.js?v=1"></script>
  <script src="locales/en.js?v=1"></script>
  <script src="locales/zh-CN.js?v=1"></script>
  <script src="data/content-locales.js?v=1"></script>
  <script src="data/romanization.js?v=8"></script>
  <script src="data/vocabulary-bank.js?v=8"></script>
  <script src="data/dictionary.js?v=1"></script>
  <script src="data/theory-lessons.js?v=1"></script>
  <script src="data/handwriting.js?v=1"></script>
  <script src="data/cloud-sync.js?v=2"></script>
  <script src="data/learning-modules.js?v=8"></script>
  <script src="data/practice-bank.js?v=8"></script>
  <script src="app.js?v=12"></script>
  <script src="data/ai-coach.js?v=3"></script>
  <script src="data/learning-memory.js?v=1"></script>
  <script src="data/adaptive-engine.js?v=2"></script>
</body>
</html>
